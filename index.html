<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#b91c1c">
  <link rel="manifest" href="manifest.json">
  <title>বাংলা বয়স গণনা</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>বাংলা বয়স গণনা</h1>
      <p class="subtitle">জন্মতারিখ থেকে সঠিক বয়স হিসাব করুন</p>

      <div class="fields">
        <label>জন্মদিন
          <input id="day" type="number" min="1" max="31" placeholder="দিন">
        </label>
        <label>জন্মমাস
          <input id="month" type="number" min="1" max="12" placeholder="মাস">
        </label>
        <label>জন্মবছর
          <input id="year" type="number" min="1" max="9999" placeholder="বছর">
        </label>
      </div>

      <button id="calculate">বয়স হিসাব করুন</button>
      <button id="today" class="secondary">আজকের তারিখ ব্যবহার করুন</button>

      <div id="message" class="message" aria-live="polite"></div>

      <section id="result" class="result" hidden>
        <h2>আপনার বয়স</h2>
        <div class="age-big"><span id="years">0</span> বছর <span id="months">0</span> মাস <span id="days">0</span> দিন</div>
        <p>মোট বয়স: <strong id="totalDays">0</strong> দিন</p>
      </section>
    </section>
    <footer><a href="privacy-policy.html">Privacy Policy</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
